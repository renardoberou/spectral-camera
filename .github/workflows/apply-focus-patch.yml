name: Apply staged focus-mode integration

on:
  push:
    branches:
      - agent/hdr-imaging-pipeline
    paths:
      - .github/workflows/apply-focus-patch.yml

permissions:
  contents: write

jobs:
  apply-focus-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/hdr-imaging-pipeline
          fetch-depth: 0

      - name: Decode and verify staged patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/focus-patch/part-*.b64 | tr -d '\n\r' | base64 --decode > /tmp/focus.patch
          git apply --check /tmp/focus.patch

      - name: Apply patch and remove staging files
        shell: bash
        run: |
          set -euo pipefail
          git apply /tmp/focus.patch
          rm -rf .github/focus-patch
          rm -f .github/workflows/apply-focus-patch.yml

      - name: Commit integrated focus modes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(focus): integrate photographer focus modes"
          git push origin HEAD:agent/hdr-imaging-pipeline
