name: Debug scene-to-film refinement patch

on:
  push:
    branches: [agent/aerochrome-tonal-refinement]
    paths: [.github/workflows/debug-scene-refinement.yml]

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aerochrome-tonal-refinement
          fetch-depth: 0
      - name: Execute embedded patch with traceback
        shell: bash
        run: |
          set -o pipefail
          python3 - <<'BOOT' 2>&1 | tee patch-diagnostic.log
          from pathlib import Path
          from textwrap import dedent
          import traceback

          workflow = Path('.github/workflows/apply-scene-film-refinement.yml').read_text()
          start = "          python3 - <<'PY'\n"
          end = "\n          PY\n"
          block = workflow.split(start, 1)[1].split(end, 1)[0]
          try:
              exec(compile(dedent(block), 'scene-film-patch', 'exec'), {})
          except BaseException:
              traceback.print_exc()
              raise
          BOOT
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scene-film-patch-diagnostic
          path: patch-diagnostic.log
