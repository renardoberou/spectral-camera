name: Debug scene-to-film refinement patch

on:
  push:
    branches: [agent/aerochrome-tonal-refinement]
    paths: [.github/workflows/debug-scene-refinement.yml]

permissions:
  contents: write

jobs:
  debug:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aerochrome-tonal-refinement
          fetch-depth: 0
      - name: Execute embedded patch and capture traceback
        shell: bash
        run: |
          python3 - <<'BOOT'
          from pathlib import Path
          from textwrap import dedent
          import contextlib
          import io
          import traceback

          output = io.StringIO()
          with contextlib.redirect_stdout(output), contextlib.redirect_stderr(output):
              try:
                  workflow = Path('.github/workflows/apply-scene-film-refinement.yml').read_text()
                  start = "          python3 - <<'PY'\n"
                  end = "\n          PY\n"
                  block = workflow.split(start, 1)[1].split(end, 1)[0]
                  exec(compile(dedent(block), 'scene-film-patch', 'exec'), {})
                  print('Patch completed without exception.')
              except BaseException:
                  traceback.print_exc()
          Path('docs/PATCH_DIAGNOSTIC_TEMP.txt').write_text(output.getvalue())
          BOOT
      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PATCH_DIAGNOSTIC_TEMP.txt
          git commit -m "chore: record temporary scene-film patch diagnostic"
          git push origin HEAD:agent/aerochrome-tonal-refinement
