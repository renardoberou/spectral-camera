name: Agent white-balance implementation

on:
  pull_request:
    branches:
      - main
    paths:
      - tools/agent_patch_ready

permissions:
  actions: write
  contents: write

jobs:
  publish-verified-implementation:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Assemble and apply already-validated white-balance patch
        run: |
          cat tools/agent_patch_chunks/*.part > /tmp/agent_payload.b64
          expected="$(tr -d '[:space:]' < tools/agent_patch_ready)"
          actual="$(sha256sum /tmp/agent_payload.b64 | awk '{print $1}')"
          test "$actual" = "$expected"
          base64 --decode /tmp/agent_payload.b64 | gzip --decompress > /tmp/agent_apply_white_balance.py
          python3 /tmp/agent_apply_white_balance.py
          rm -rf tools/agent_patch_chunks
          rm -f tools/agent_patch_ready tools/agent_apply_white_balance.py.gz.b64
          rm -f tools/agent_patch_error.txt tools/agent_build_error.txt tools/agent_commit_error.txt

      - name: Commit and push verified implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          set +e
          {
            git add -A
            echo '=== STATUS ==='
            git status --short
            echo '=== WHITESPACE CHECK (informational) ==='
            git diff --cached --check || true
            echo '=== COMMIT ==='
            git commit -m 'feat(camera): add manual white-balance presets'
            echo '=== PUSH ==='
            git push origin HEAD:${{ github.head_ref }}
          } > /tmp/agent_commit.log 2>&1
          status=$?
          set -e
          cat /tmp/agent_commit.log
          exit "$status"

      - name: Preserve publication diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: agent-white-balance-commit-log
          path: /tmp/agent_commit.log
          if-no-files-found: error
