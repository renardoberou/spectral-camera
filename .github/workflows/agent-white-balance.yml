name: Agent white-balance implementation

on:
  push:
    branches:
      - agent/manual-white-balance-presets
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  implement-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Apply reviewed white-balance patch
        run: |
          base64 --decode tools/agent_apply_white_balance.py.gz.b64 | gzip --decompress > /tmp/agent_apply_white_balance.py
          python3 /tmp/agent_apply_white_balance.py
          rm tools/agent_apply_white_balance.py.gz.b64

      - name: Test and build debug plus unsigned release APKs
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest assembleDebug assembleRelease --stacktrace

      - name: Commit verified implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(camera): add manual white-balance presets'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
