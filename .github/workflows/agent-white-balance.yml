name: Agent white-balance implementation

on:
  push:
    branches:
      - agent/manual-white-balance-presets
    paths:
      - tools/agent_patch_ready
  pull_request:
    branches:
      - main
    paths:
      - tools/agent_patch_ready

permissions:
  contents: write

jobs:
  implement-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Assemble and apply reviewed white-balance patch
        run: |
          cat tools/agent_patch_chunks/*.part > /tmp/agent_payload.b64
          expected="$(tr -d '[:space:]' < tools/agent_patch_ready)"
          actual="$(sha256sum /tmp/agent_payload.b64 | awk '{print $1}')"
          test "$actual" = "$expected"
          base64 --decode /tmp/agent_payload.b64 | gzip --decompress > /tmp/agent_apply_white_balance.py
          set +e
          python3 /tmp/agent_apply_white_balance.py > /tmp/agent_patch.log 2>&1
          status=$?
          set -e
          cat /tmp/agent_patch.log
          if [ "$status" -ne 0 ]; then
            git reset --hard HEAD
            git clean -fd
            cp /tmp/agent_patch.log tools/agent_patch_error.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add tools/agent_patch_error.txt
            git commit -m 'chore(agent): record white-balance patch failure'
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
            exit "$status"
          fi
          rm -rf tools/agent_patch_chunks
          rm -f tools/agent_patch_ready tools/agent_apply_white_balance.py.gz.b64
          rm -f tools/agent_patch_error.txt tools/agent_build_error.txt

      - name: Test and build debug plus unsigned release APKs
        run: |
          chmod +x ./gradlew
          set +e
          ./gradlew testDebugUnitTest assembleDebug assembleRelease --stacktrace > /tmp/agent_build.log 2>&1
          status=$?
          set -e
          cat /tmp/agent_build.log
          if [ "$status" -ne 0 ]; then
            git reset --hard HEAD
            git clean -fd
            cp /tmp/agent_build.log tools/agent_build_error.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add tools/agent_build_error.txt
            git commit -m 'chore(agent): record white-balance build failure'
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
            exit "$status"
          fi

      - name: Commit verified implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(camera): add manual white-balance presets'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
