name: Staged scene-film correction

on:
  workflow_dispatch:

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - name: Embedded correction source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one occurrence, found {count}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          shader = "app/src/main/java/com/renardoberou/spectralcamera/core/gl/SpectralGlPipeline.kt"
          replace_once(shader, "    vec3 acc = src;", "    vec3 acc = raw;")
          Path(".github/workflows/apply-scene-film-refinement.yml").unlink()
          PY
