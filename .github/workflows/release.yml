name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  signed-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant gradlew execute permission
        run: chmod +x ./gradlew

      - name: Decode keystore from secrets
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          missing=0
          for name in KEYSTORE_B64 KEYSTORE_PASS KEY_ALIAS KEY_PASS; do
            if [ -z "${!name}" ]; then
              echo "::error::$name secret is missing — follow docs/RELEASE.md first."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Derive version name from tag
        run: |
          echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build signed APK + AAB
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Stage release assets
        run: |
          cp app/build/outputs/apk/release/app-release.apk "spectral-camera-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "spectral-camera-${GITHUB_REF_NAME}.aab"

      - name: Verify signature and generate checksums
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APKSIGNER=$(find "$SDK_ROOT/build-tools" -maxdepth 2 -name apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found under $SDK_ROOT/build-tools — cannot verify the release signature."
            exit 1
          fi
          echo "Using $APKSIGNER"
          "$APKSIGNER" verify --verbose "spectral-camera-${GITHUB_REF_NAME}.apk"
          sha256sum spectral-camera-*.apk spectral-camera-*.aab | tee CHECKSUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            spectral-camera-*.apk
            spectral-camera-*.aab
            CHECKSUMS.txt
          body: |
            Signed release. Verify the APK signature yourself before installing:
            `apksigner verify --verbose spectral-camera-*.apk`

            SHA-256 checksums are in `CHECKSUMS.txt`.
          generate_release_notes: true
          fail_on_unmatched_files: true
