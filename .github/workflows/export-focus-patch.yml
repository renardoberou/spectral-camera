name: Export staged focus patch

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - name: Decode patch
        run: |
          set -euo pipefail
          : > focus.patch
          for part in .github/focus-patch/part-*.b64; do
            base64 --decode "$part" >> focus.patch
          done
          sha256sum focus.patch
          grep '^diff --git ' focus.patch
      - uses: actions/upload-artifact@v4
        with:
          name: focus-integration-patch
          path: focus.patch
