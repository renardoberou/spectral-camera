name: Android CI

on:
  push:
    branches: [main, agent/hdr-imaging-pipeline]
  pull_request:
    branches: [main]

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Integrate staged focus-mode sources
        if: (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/hdr-imaging-pipeline') || (github.event_name == 'push' && github.ref_name == 'agent/hdr-imaging-pipeline')
        run: |
          set -euo pipefail
          if [ ! -d .github/focus-patch ]; then
            echo "No staged focus patch remains."
            exit 0
          fi
          : > /tmp/focus.patch
          for part in .github/focus-patch/part-*.b64; do
            base64 --decode "$part" >> /tmp/focus.patch
          done
          grep '^diff --git ' /tmp/focus.patch || true
          if git apply --3way /tmp/focus.patch; then
            echo "Applied staged focus-mode patch with Git three-way merge support."
          elif git apply --reverse --check /tmp/focus.patch; then
            echo "Focus-mode patch is already integrated."
          else
            echo "::error::Staged focus patch could not be merged into the current tree."
            git status --short
            exit 1
          fi

      - name: Commit integrated focus-mode sources
        if: (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/hdr-imaging-pipeline') || (github.event_name == 'push' && github.ref_name == 'agent/hdr-imaging-pipeline')
        run: |
          set -euo pipefail
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "feat(focus): integrate focus modes across camera and live UI"
            git push origin HEAD:agent/hdr-imaging-pipeline
          else
            echo "No integration commit needed."
          fi

      - name: Reject tracked signing material
        run: |
          tracked="$(git ls-files '*.jks' '*.keystore')"
          if [ -n "$tracked" ]; then
            echo "::error::Signing material must never be tracked in Git:"
            echo "$tracked"
            exit 1
          fi
          if git grep -nE 'spectraldebug|signing/debug-only\.keystore' -- app build.gradle.kts settings.gradle.kts gradle.properties 2>/dev/null; then
            echo "::error::Retired public signing credentials are still referenced by build or application code."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant gradlew execute permission
        run: chmod +x ./gradlew

      - name: Test and build debug plus unsigned release APKs
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest assembleDebug assembleRelease --stacktrace 2>&1 | tee build.log

      - name: Verify ordinary CI release is unsigned
        run: |
          unsigned="app/build/outputs/apk/release/app-release-unsigned.apk"
          signed="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$unsigned" ]; then
            echo "::error::Expected unsigned release APK was not produced."
            find app/build/outputs/apk -maxdepth 3 -type f -print || true
            exit 1
          fi
          if [ -f "$signed" ]; then
            echo "::error::Ordinary CI unexpectedly produced a signed release APK."
            exit 1
          fi

      - name: Publish failure log as issue
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### Build failure, run ${{ github.run_number }}'
            echo '```'
            grep -nE "^e: |error: |Caused by|FAILURE:|What went wrong" -A 2 build.log 2>/dev/null | head -c 30000
            echo
            echo "=== LOG TAIL ==="
            tail -c 25000 build.log 2>/dev/null
            echo '```'
          } > /tmp/body.md || true
          gh issue create --repo "$GITHUB_REPOSITORY" --title "CI failure: run ${{ github.run_number }}" --body-file /tmp/body.md

      - name: Upload temporary source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: spectral-camera-source-snapshot
          path: |
            .
            !.git/**
            !**/build/**
            !build.log

      - name: Upload ephemeral debug APK
        uses: actions/upload-artifact@v4
        with:
          name: spectral-camera-debug-ephemeral
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: spectral-camera-release-UNSIGNED-not-installable-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
