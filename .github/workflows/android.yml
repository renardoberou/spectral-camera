name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant gradlew execute permission
        run: chmod +x ./gradlew

      - name: Build debug and unsigned release APKs
        run: |
          set -o pipefail
          ./gradlew assembleDebug assembleRelease --stacktrace 2>&1 | tee build.log

      - name: Publish failure log as issue
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### Build failure, run ${{ github.run_number }}'
            echo '```'
            grep -nE "^e: |error: |Caused by|FAILURE:|What went wrong" -A 2 build.log 2>/dev/null | head -c 30000
            echo
            echo "=== LOG TAIL ==="
            tail -c 25000 build.log 2>/dev/null
            echo '```'
          } > /tmp/body.md || true
          gh issue create --repo "$GITHUB_REPOSITORY" --title "CI failure: run ${{ github.run_number }}" --body-file /tmp/body.md

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: spectral-camera-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: spectral-camera-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
