name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reject tracked signing material
        run: |
          tracked="$(git ls-files '*.jks' '*.keystore')"
          if [ -n "$tracked" ]; then
            echo "::error::Signing material must never be tracked in Git:"
            echo "$tracked"
            exit 1
          fi
          if git grep -nE 'spectraldebug|signing/debug-only\.keystore' -- app build.gradle.kts settings.gradle.kts gradle.properties 2>/dev/null; then
            echo "::error::Retired public signing credentials are still referenced by build or application code."
            exit 1
          fi

      - name: Validate launcher source resources
        run: |
          set -euo pipefail
          grep -q 'android:icon="@mipmap/ic_launcher_1196"' app/src/main/AndroidManifest.xml
          grep -q 'android:roundIcon="@mipmap/ic_launcher_1196_round"' app/src/main/AndroidManifest.xml
          if git ls-files | grep -q 'ic_launcher_1195'; then
            echo "::error::Broken temporary 1.19.5 launcher resources are still tracked."
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          import struct
          import zlib

          expected = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192,
          }

          def validate_png(path: Path, size: int) -> None:
              data = path.read_bytes()
              if data[:8] != b"\x89PNG\r\n\x1a\n":
                  raise SystemExit(f"{path}: invalid PNG signature")
              length = struct.unpack(">I", data[8:12])[0]
              if data[12:16] != b"IHDR" or length != 13:
                  raise SystemExit(f"{path}: missing canonical IHDR")
              width, height = struct.unpack(">II", data[16:24])
              if (width, height) != (size, size):
                  raise SystemExit(f"{path}: expected {size}x{size}, got {width}x{height}")
              stored_crc = struct.unpack(">I", data[29:33])[0]
              actual_crc = zlib.crc32(data[12:29]) & 0xFFFFFFFF
              if stored_crc != actual_crc:
                  raise SystemExit(f"{path}: corrupt IHDR CRC")

          for density, size in expected.items():
              root = Path(f"app/src/main/res/mipmap-{density}")
              validate_png(root / "ic_launcher_1196.png", size)
              validate_png(root / "ic_launcher_1196_round.png", size)
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant gradlew execute permission
        run: chmod +x ./gradlew

      - name: Test and build debug plus unsigned release APKs
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest assembleDebug assembleRelease --stacktrace 2>&1 | tee build.log

      - name: Verify launcher resources inside debug APK
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import struct
          import zipfile
          import zlib

          apk = Path("app/build/outputs/apk/debug/app-debug.apk")
          expected = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192,
          }

          with zipfile.ZipFile(apk) as archive:
              names = set(archive.namelist())
              if any("ic_launcher_1195" in name for name in names):
                  raise SystemExit("APK still contains broken temporary launcher resources")
              for density, size in expected.items():
                  for suffix in ("", "_round"):
                      name = f"res/mipmap-{density}-v4/ic_launcher_1196{suffix}.png"
                      if name not in names:
                          raise SystemExit(f"APK missing {name}")
                      data = archive.read(name)
                      if data[:8] != b"\x89PNG\r\n\x1a\n":
                          raise SystemExit(f"{name}: invalid PNG signature")
                      width, height = struct.unpack(">II", data[16:24])
                      if (width, height) != (size, size):
                          raise SystemExit(f"{name}: expected {size}x{size}, got {width}x{height}")
                      stored_crc = struct.unpack(">I", data[29:33])[0]
                      actual_crc = zlib.crc32(data[12:29]) & 0xFFFFFFFF
                      if stored_crc != actual_crc:
                          raise SystemExit(f"{name}: corrupt IHDR CRC")
          PY

      - name: Verify ordinary CI release is unsigned
        run: |
          unsigned="app/build/outputs/apk/release/app-release-unsigned.apk"
          signed="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$unsigned" ]; then
            echo "::error::Expected unsigned release APK was not produced."
            find app/build/outputs/apk -maxdepth 3 -type f -print || true
            exit 1
          fi
          if [ -f "$signed" ]; then
            echo "::error::Ordinary CI unexpectedly produced a signed release APK."
            exit 1
          fi

      - name: Publish failure log as issue
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### Build failure, run ${{ github.run_number }}'
            echo '```'
            grep -nE "^e: |error: |Caused by|FAILURE:|What went wrong" -A 2 build.log 2>/dev/null | head -c 30000
            echo
            echo "=== LOG TAIL ==="
            tail -c 25000 build.log 2>/dev/null
            echo '```'
          } > /tmp/body.md || true
          gh issue create --repo "$GITHUB_REPOSITORY" --title "CI failure: run ${{ github.run_number }}" --body-file /tmp/body.md

      - name: Upload ephemeral debug APK
        uses: actions/upload-artifact@v4
        with:
          name: spectral-camera-debug-ephemeral
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: spectral-camera-release-UNSIGNED-not-installable-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
