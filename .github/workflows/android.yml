name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Integrate pending lens reversion and Live UI cleanup
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/hdr-imaging-pipeline'
        run: |
          set -euo pipefail
          pending=.github/workflows/revert-lens-and-clean-live-ui.yml
          if [ ! -f "$pending" ]; then
            echo "No pending Live UI integration."
            exit 0
          fi

          base=db07aa582b6afd3528b05fb09bb12ddb3c9bb79b
          git checkout "$base" -- \
            .github/workflows/android.yml \
            README.md \
            app/build.gradle.kts \
            app/src/main/java/com/renardoberou/spectralcamera/core/Models.kt \
            app/src/main/java/com/renardoberou/spectralcamera/core/camera/CameraController.kt \
            app/src/main/java/com/renardoberou/spectralcamera/core/data/CameraSettingsRepository.kt \
            app/src/main/java/com/renardoberou/spectralcamera/core/media/MediaRepository.kt \
            app/src/main/java/com/renardoberou/spectralcamera/core/state/SpectralViewModel.kt \
            app/src/main/java/com/renardoberou/spectralcamera/ui/SpectralCameraApp.kt \
            app/src/main/java/com/renardoberou/spectralcamera/ui/screens/LiveCameraScreen.kt
          rm -f \
            app/src/main/java/com/renardoberou/spectralcamera/core/camera/CameraLensCatalog.kt \
            app/src/test/java/com/renardoberou/spectralcamera/core/camera/CameraLensCatalogTest.kt \
            docs/PLAN_2026-07-22_lens-selector.md

          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent, indent

          path = Path("app/src/main/java/com/renardoberou/spectralcamera/ui/screens/LiveCameraScreen.kt")
          text = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global text
              if text.count(old) != 1:
                  raise SystemExit(f"Expected exactly one occurrence: {old!r}; found {text.count(old)}")
              text = text.replace(old, new, 1)

          replace_once(
              "import androidx.compose.foundation.layout.Box\n",
              "import androidx.compose.foundation.layout.Box\nimport androidx.compose.foundation.layout.BoxWithConstraints\n",
          )
          replace_once(
              "import androidx.compose.foundation.layout.size\n",
              "import androidx.compose.foundation.layout.size\nimport androidx.compose.foundation.layout.weight\n",
          )
          for unused in (
              "import androidx.compose.material.icons.outlined.Collections\n",
              "import androidx.compose.material.icons.outlined.Thermostat\n",
              "import androidx.compose.material.icons.outlined.Tune\n",
              "import androidx.compose.material3.AssistChip\n",
          ):
              replace_once(unused, "")
          replace_once(
              "import androidx.compose.ui.text.style.TextAlign\n",
              "import androidx.compose.ui.text.style.TextAlign\nimport androidx.compose.ui.text.style.TextOverflow\n",
          )
          replace_once(
              "                .fillMaxSize()\n                .padding(16.dp),",
              "                .fillMaxSize()\n                .padding(horizontal = 12.dp, vertical = 10.dp),",
          )

          top_marker = "            Column(verticalArrangement = Arrangement.spacedBy(8.dp)) {\n"
          bottom_marker = "\n            }\n\n            Column(verticalArrangement = Arrangement.spacedBy(10.dp)) {"
          top_start = text.index(top_marker) + len(top_marker)
          top_end = text.index(bottom_marker, top_start)
          header = dedent('''
          Surface(
              modifier = Modifier.fillMaxWidth(),
              color = MaterialTheme.colorScheme.surface.copy(alpha = 0.22f),
              contentColor = MaterialTheme.colorScheme.onSurface,
              shape = MaterialTheme.shapes.large,
              tonalElevation = 6.dp,
          ) {
              BoxWithConstraints(
                  modifier = Modifier
                      .fillMaxWidth()
                      .padding(horizontal = 12.dp, vertical = 8.dp),
              ) {
                  val wideHeader = maxWidth >= 520.dp
                  if (wideHeader) {
                      Row(
                          modifier = Modifier.fillMaxWidth(),
                          horizontalArrangement = Arrangement.spacedBy(18.dp),
                          verticalAlignment = Alignment.CenterVertically,
                      ) {
                          Column(
                              modifier = Modifier.weight(0.9f),
                              verticalArrangement = Arrangement.spacedBy(1.dp),
                          ) {
                              Text(
                                  text = "Spectral Camera",
                                  style = MaterialTheme.typography.titleLarge,
                                  fontWeight = FontWeight.SemiBold,
                                  maxLines = 1,
                              )
                              Text(
                                  text = "${settings.sensorMode.label} • simulated IR",
                                  style = MaterialTheme.typography.bodySmall,
                                  maxLines = 1,
                                  overflow = TextOverflow.Ellipsis,
                              )
                          }
                          Column(
                              modifier = Modifier.weight(1.35f),
                              horizontalAlignment = Alignment.End,
                              verticalArrangement = Arrangement.spacedBy(1.dp),
                          ) {
                              Text(
                                  text = "${settings.preset.label} • ${settings.focusMode.label}",
                                  style = MaterialTheme.typography.labelMedium,
                                  color = MaterialTheme.colorScheme.secondary,
                                  textAlign = TextAlign.End,
                                  maxLines = 1,
                                  overflow = TextOverflow.Ellipsis,
                              )
                              Text(
                                  text = "${settings.requestedCaptureLabel} • ${settings.outputMode.label}",
                                  style = MaterialTheme.typography.labelMedium,
                                  fontWeight = FontWeight.SemiBold,
                                  color = MaterialTheme.colorScheme.primary,
                                  textAlign = TextAlign.End,
                                  maxLines = 1,
                                  overflow = TextOverflow.Ellipsis,
                              )
                              if (doubleExposureState.waitingForSecond) {
                                  Text(
                                      text = "Double Exposure • frame 1 stored",
                                      style = MaterialTheme.typography.labelSmall,
                                      color = MaterialTheme.colorScheme.tertiary,
                                      textAlign = TextAlign.End,
                                  )
                              }
                              if (settings.manualMode) {
                                  Text(
                                      text = "Manual exposure • ISO ${settings.manualIso}",
                                      style = MaterialTheme.typography.labelSmall,
                                      color = MaterialTheme.colorScheme.error,
                                      textAlign = TextAlign.End,
                                  )
                              }
                          }
                      }
                  } else {
                      Column(verticalArrangement = Arrangement.spacedBy(2.dp)) {
                          Row(
                              modifier = Modifier.fillMaxWidth(),
                              horizontalArrangement = Arrangement.SpaceBetween,
                              verticalAlignment = Alignment.CenterVertically,
                          ) {
                              Text(
                                  text = "Spectral Camera",
                                  style = MaterialTheme.typography.titleLarge,
                                  fontWeight = FontWeight.SemiBold,
                                  maxLines = 1,
                              )
                              Text(
                                  text = settings.focusMode.label,
                                  style = MaterialTheme.typography.labelSmall,
                                  color = MaterialTheme.colorScheme.tertiary,
                                  maxLines = 1,
                              )
                          }
                          Text(
                              text = "${settings.sensorMode.label} • ${settings.preset.label}",
                              style = MaterialTheme.typography.bodySmall,
                              color = MaterialTheme.colorScheme.secondary,
                              maxLines = 1,
                              overflow = TextOverflow.Ellipsis,
                          )
                          Text(
                              text = "${settings.requestedCaptureLabel} • ${settings.outputMode.label}",
                              style = MaterialTheme.typography.labelMedium,
                              fontWeight = FontWeight.SemiBold,
                              color = MaterialTheme.colorScheme.primary,
                              maxLines = 1,
                              overflow = TextOverflow.Ellipsis,
                          )
                          if (doubleExposureState.waitingForSecond) {
                              Text(
                                  text = "Double Exposure • frame 1 stored",
                                  style = MaterialTheme.typography.labelSmall,
                                  color = MaterialTheme.colorScheme.tertiary,
                              )
                          }
                          if (settings.manualMode) {
                              Text(
                                  text = "Manual exposure • ISO ${settings.manualIso}",
                                  style = MaterialTheme.typography.labelSmall,
                                  color = MaterialTheme.colorScheme.error,
                              )
                          }
                      }
                  }
              }
          }
          ''').strip()
          text = text[:top_start] + indent(header, "                ") + text[top_end:]

          bottom_column = text.index("            Column(verticalArrangement = Arrangement.spacedBy(10.dp)) {")
          row_start = text.index(
              "                Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {",
              bottom_column,
          )
          exposure_panel = "\n                if (capabilities?.exposureSupported == true && showExposure) {"
          row_end = text.index(exposure_panel, row_start)
          controls = dedent('''
          Row(
              modifier = Modifier
                  .fillMaxWidth()
                  .horizontalScroll(rememberScrollState()),
              horizontalArrangement = Arrangement.spacedBy(8.dp),
          ) {
              if (capabilities?.exposureSupported == true) {
                  FilterChip(
                      selected = showExposure,
                      onClick = {
                          showExposure = !showExposure
                          if (showExposure) showFocus = false
                      },
                      label = { Text(if (showExposure) "Exposure ▴" else "Exposure ▾") },
                  )
              }
              if (capabilities != null) {
                  FilterChip(
                      selected = showFocus,
                      onClick = {
                          showFocus = !showFocus
                          if (showFocus) showExposure = false
                      },
                      label = { Text(if (showFocus) "Focus ▴" else "Focus ▾") },
                  )
              }
              FilterChip(
                  selected = false,
                  onClick = { showPresets = true },
                  label = { Text("Presets") },
              )
          }
          ''').strip()
          text = text[:row_start] + indent(controls, "                ") + text[row_end:]
          path.write_text(text)

          Path("docs/PLAN_2026-07-22_live-ui-cleanup.md").write_text(dedent('''
          # Plan: compact Live-screen information and controls

          **Date:** 2026-07-22  
          **Branch:** `agent/hdr-imaging-pipeline`  
          **Draft PR:** #25

          ## Change

          The experimental physical-lens selector was reverted. Spectral Camera returns to the established rear/selfie camera switch while retaining all focus modes.

          The duplicate top shortcuts for Gallery and Hardware were removed because those destinations remain permanently available in the bottom navigation. Presets moved into the same control row as Exposure and Focus.

          The camera-information surface now fills the available width and responds to screen shape. Wide screens use a compact two-column arrangement: app/sensor identity on the left and preset/focus/capture state on the right. Narrow screens use three short lines. Exceptional Double Exposure and manual-exposure state appears only when active.

          ## Validation

          1. Test portrait and landscape orientations.
          2. Confirm no top Gallery, Hardware, Lens, or Presets shortcut remains.
          3. Confirm Presets sits beside Exposure and Focus and still opens the preset sheet.
          4. Confirm Gallery and Hardware remain accessible through bottom navigation.
          5. Confirm the rear/selfie switch still works.
          6. Confirm the header does not clip long preset, focus, or output labels.
          7. Confirm Double Exposure frame-1 and manual-exposure warnings remain visible.
          ''').lstrip())
          Path(".github/workflows/revert-lens-and-clean-live-ui.yml").unlink()
          PY

      - name: Commit integrated reversion and UI cleanup
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/hdr-imaging-pipeline'
        run: |
          set -euo pipefail
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "fix(ui): revert lens selector and compact live controls"
            git push origin HEAD:agent/hdr-imaging-pipeline
          else
            echo "No integration commit needed."
          fi

      - name: Reject tracked signing material
        run: |
          tracked="$(git ls-files '*.jks' '*.keystore')"
          if [ -n "$tracked" ]; then
            echo "::error::Signing material must never be tracked in Git:"
            echo "$tracked"
            exit 1
          fi
          if git grep -nE 'spectraldebug|signing/debug-only\.keystore' -- app build.gradle.kts settings.gradle.kts gradle.properties 2>/dev/null; then
            echo "::error::Retired public signing credentials are still referenced by build or application code."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant gradlew execute permission
        run: chmod +x ./gradlew

      - name: Test and build debug plus unsigned release APKs
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest assembleDebug assembleRelease --stacktrace 2>&1 | tee build.log

      - name: Verify ordinary CI release is unsigned
        run: |
          unsigned="app/build/outputs/apk/release/app-release-unsigned.apk"
          signed="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$unsigned" ]; then
            echo "::error::Expected unsigned release APK was not produced."
            find app/build/outputs/apk -maxdepth 3 -type f -print || true
            exit 1
          fi
          if [ -f "$signed" ]; then
            echo "::error::Ordinary CI unexpectedly produced a signed release APK."
            exit 1
          fi

      - name: Publish failure log as issue
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### Build failure, run ${{ github.run_number }}'
            echo '```'
            grep -nE "^e: |error: |Caused by|FAILURE:|What went wrong" -A 2 build.log 2>/dev/null | head -c 30000
            echo
            echo "=== LOG TAIL ==="
            tail -c 25000 build.log 2>/dev/null
            echo '```'
          } > /tmp/body.md || true
          gh issue create --repo "$GITHUB_REPOSITORY" --title "CI failure: run ${{ github.run_number }}" --body-file /tmp/body.md

      - name: Upload ephemeral debug APK
        uses: actions/upload-artifact@v4
        with:
          name: spectral-camera-debug-ephemeral
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: spectral-camera-release-UNSIGNED-not-installable-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
