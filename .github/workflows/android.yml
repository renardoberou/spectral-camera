name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Finalize scene-to-film refinement
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/aerochrome-tonal-refinement'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/renardoberou/spectralcamera/core/gl/SpectralGlPipeline.kt')
          text = path.read_text()

          def one(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one occurrence, found {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          # Accumulate the wide sky blur in one domain. The previous in-progress
          # implementation mixed a precurved centre pixel with raw neighbours and
          # then normalized the whole average again.
          one('    vec3 acc = src;', '    vec3 acc = raw;')

          one(
              '''vec3 blur = acc / wsum;
// Keep sky detection in the same normalized scene domain as src/srcC.
blur = applyPreFilmCurve(
    clamp((blur - vec3(uAutoLo)) / max(uAutoHi - uAutoLo, 0.001), 0.0, 1.0),
    sceneCurveStrength);

float bLuma = lumaOf(blur);''',
              '''    vec3 blur = acc / wsum;
    // Keep sky detection in the same normalized scene domain as src/srcC.
    blur = applyPreFilmCurve(
        clamp((blur - vec3(uAutoLo)) / max(uAutoHi - uAutoLo, 0.001), 0.0, 1.0),
        sceneCurveStrength);

    float bLuma = lumaOf(blur);''',
          )

          one(
              '''// Clear blue sky receives only a low-frequency brightness modulation;
// cloud structure receives more detail. This reduces blue-channel noise
// without smearing real clouds.
float skyDetail = clamp(luma - smoothLuma, -0.10, 0.10);
float skyDetailGain = mix(0.44, 0.16, clearBlue);
skyCol = clamp(skyCol + skyDetail * skyDetailGain, 0.0, 1.0);''',
              '''    // Clear blue sky receives only a low-frequency brightness modulation;
    // cloud structure receives more detail. This reduces blue-channel noise
    // without smearing real clouds.
    float skyDetail = clamp(luma - smoothLuma, -0.10, 0.10);
    float skyDetailGain = mix(0.44, 0.16, clearBlue);
    skyCol = clamp(skyCol + skyDetail * skyDetailGain, 0.0, 1.0);''',
          )

          one(
              '''// The final IGN dither already breaks 8-bit ramps. Keep only a tiny mask
// perturbation so classification does not become visible blue speckle.
skyMask = clamp(skyMask + hashNoise(grainUv * 0.31 + vec2(uGrainSeed)) * 0.002, 0.0, 1.0);''',
              '''    // The final IGN dither already breaks 8-bit ramps. Keep only a tiny mask
    // perturbation so classification does not become visible blue speckle.
    skyMask = clamp(skyMask + hashNoise(grainUv * 0.31 + vec2(uGrainSeed)) * 0.002, 0.0, 1.0);''',
          )

          path.write_text(text)
          Path('.github/workflows/finalize-scene-film-refinement.yml').unlink(missing_ok=True)
          PY

          # Restore the ordinary CI definition in the resulting source commit.
          git checkout origin/main -- .github/workflows/android.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(engine): normalize sky blur once in the correct source domain"
          git push origin HEAD:agent/aerochrome-tonal-refinement

      - name: Reject tracked signing material
        run: |
          tracked="$(git ls-files '*.jks' '*.keystore')"
          if [ -n "$tracked" ]; then
            echo "::error::Signing material must never be tracked in Git:"
            echo "$tracked"
            exit 1
          fi
          if git grep -nE 'spectraldebug|signing/debug-only\.keystore' -- app build.gradle.kts settings.gradle.kts gradle.properties 2>/dev/null; then
            echo "::error::Retired public signing credentials are still referenced by build or application code."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant gradlew execute permission
        run: chmod +x ./gradlew

      - name: Test and build debug plus unsigned release APKs
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest assembleDebug assembleRelease --stacktrace 2>&1 | tee build.log

      - name: Verify ordinary CI release is unsigned
        run: |
          unsigned="app/build/outputs/apk/release/app-release-unsigned.apk"
          signed="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$unsigned" ]; then
            echo "::error::Expected unsigned release APK was not produced."
            find app/build/outputs/apk -maxdepth 3 -type f -print || true
            exit 1
          fi
          if [ -f "$signed" ]; then
            echo "::error::Ordinary CI unexpectedly produced a signed release APK."
            exit 1
          fi

      - name: Publish failure log as issue
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### Build failure, run ${{ github.run_number }}'
            echo '```'
            grep -nE "^e: |error: |Caused by|FAILURE:|What went wrong" -A 2 build.log 2>/dev/null | head -c 30000
            echo
            echo "=== LOG TAIL ==="
            tail -c 25000 build.log 2>/dev/null
            echo '```'
          } > /tmp/body.md || true
          gh issue create --repo "$GITHUB_REPOSITORY" --title "CI failure: run ${{ github.run_number }}" --body-file /tmp/body.md

      - name: Upload ephemeral debug APK
        uses: actions/upload-artifact@v4
        with:
          name: spectral-camera-debug-ephemeral
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: spectral-camera-release-UNSIGNED-not-installable-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
